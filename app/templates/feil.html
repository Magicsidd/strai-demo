{% extends "base.html" %}
{% block tittel %}{{ tittel }}{% endblock %}
{% block innhold %}
<div class="kort kvittering">
  <div class="overline">Feil</div>
  <h1 style="margin-top:10px">{{ tittel }}</h1>
  <p style="color:var(--blekk-2)">{{ feil }}</p>

</div>
{% endblock %}
